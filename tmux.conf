set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on

set-option -sg escape-time 10

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g set-clipboard on

# Use Vim-like keybindings for pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @catppuccin_flavour 'macchiato'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


set -g pane-active-border-style fg=red

set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 140
set -g status-style "bg=#24273a,fg=#cad3f5"

set -g status-left "#[bg=#8aadf4,fg=#24273a,bold]#{?client_prefix,#[bg=#eed49f],} #S #[bg=#24273a,fg=#8aadf4,none]#{?client_prefix,#[fg=#eed49f],}#{?window_zoomed_flag,#[fg=#f5a97f] ,}#{?pane_in_mode,#[fg=#c6a0f6] ,}"

set -g window-status-separator ""
set -g window-status-format "#[fg=#6e738d] #I #W "
set -g window-status-current-format "#[fg=#8aadf4,bold] #I #W "
set -g window-status-activity-style "fg=#eed49f"

set -g status-right "#[fg=#a6da95]#(~/.config/tmux/scripts/git.sh '#{pane_current_path}')#[fg=#f5a97f]#(~/.config/tmux/scripts/cpu.sh)#(~/.config/tmux/scripts/gpu.sh)#(~/.config/tmux/scripts/claude_usage.sh) "
